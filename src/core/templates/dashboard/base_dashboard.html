<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Phishing Platform{% endblock %}</title>
    {% load static %}
    <link rel="icon" href="{% static 'img/icon.png' %}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/dashboard.css' %}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark fixed-top">
        <div class="w-100 d-flex justify-content-between align-items-center px-3">
            <a class="navbar-brand" href="{% url 'dashboard' %}">AntiPhish</a>
            <div class="d-flex align-items-center">
                <span class="text-light me-3">{{ request.user.username }}</span>
                <a href="{% url 'logout' %}" class="btn btn-outline-light">Log out</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row g-0">
            <div class="col-lg-2 bg-light sidebar">
                <div class="p-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'add_targets' %}">👥 Add targets</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'edit_template' %}">📝 Template</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'send_email' %}">📤 Mailing</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'email_logs' %}">📨 Logs</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'company_stats' %}">📈 Statistic</a>
                        </li>
                    </ul>
                </div>
            </div>

            <div class="col-lg-10 main-content">
                {% block content %}{% endblock %}
                {% if messages %}
                    <div class="container mt-3">
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }}" role="alert">
                                {{ message }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
            </div>            
        </div>
    </div>
</body>
</html>
